<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline — Book It Daily</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#222222" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icons/bookitdaily-192.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --line: #e5e5e2;
        --accent: oklch(0.42 0.06 195);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a1a;
          --fg: #fafaf9;
          --muted: #9a9a9a;
          --line: rgba(255, 255, 255, 0.1);
          --accent: oklch(0.58 0.08 195);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Manrope", "Poppins", sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--fg);
        color: var(--bg);
        display: grid;
        place-items: center;
        font-family: Georgia, serif;
        font-size: 32px;
        margin: 0 auto 28px;
        line-height: 1;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 12px;
        letter-spacing: -0.01em;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 15px;
      }
      .tip {
        font-size: 12px;
        color: var(--muted);
        background: rgba(0, 0, 0, 0.04);
        padding: 12px 14px;
        border-radius: 10px;
        text-align: left;
        margin-top: 20px;
      }
      @media (prefers-color-scheme: dark) {
        .tip {
          background: rgba(255, 255, 255, 0.04);
        }
      }
      button {
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 20px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      button:active {
        transform: translateY(1px);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: oklch(0.62 0.16 25);
        display: inline-block;
        vertical-align: middle;
        margin-right: 6px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">B</div>
      <h1><span class="dot" aria-hidden="true"></span>You&rsquo;re offline</h1>
      <p>
        Book It Daily can&rsquo;t reach the network right now. Anything you already loaded still works
        from cache. Once you&rsquo;re back online this page will refresh automatically.
      </p>
      <button onclick="location.reload()">Try again</button>
      <div class="tip">
        Tip: bookings, calendar, and clients you visited recently are cached. New data
        won&rsquo;t sync until you&rsquo;re back online.
      </div>
    </div>
    <script>
      // Auto-reload when the user comes back online.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
